[package]
name = "detect-secrets-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Fast native Rust POC clone of detect-secrets"
readme = "README.md"
repository = "https://github.com/vv-bogdanov/detect-secrets-rs"
homepage = "https://github.com/vv-bogdanov/detect-secrets-rs#readme"
keywords = ["detect-secrets", "secrets", "security", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "/src/**",
    "/tests/**",
    "/fixtures/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
]

[[bin]]
name = "detect-secrets-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
aho-corasick = "1.1"
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
rayon = "1.11"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"

[dev-dependencies]
assert_cmd = "2.0"
tempfile = "3.14"

[profile.release]
strip = "symbols"
panic = "abort"
