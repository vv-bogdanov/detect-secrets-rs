[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "detect-secrets-rs"
version = "0.1.0"
description = "Fast native Rust POC clone of detect-secrets"
readme = "README.md"
requires-python = ">=3.8"
license = "Apache-2.0"
authors = [{ name = "vvbogdanov" }]
keywords = ["detect-secrets", "secrets", "security", "cli", "rust"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/vv-bogdanov/detect-secrets-rs#readme"
Repository = "https://github.com/vv-bogdanov/detect-secrets-rs"
Issues = "https://github.com/vv-bogdanov/detect-secrets-rs/issues"

[tool.maturin]
bindings = "bin"
manifest-path = "Cargo.toml"
